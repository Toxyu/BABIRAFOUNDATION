name: Media pipeline checks

on:
  push:
    paths:
      - media-processor-python/**
      - .github/workflows/media-pipeline.yml
  pull_request:
    paths:
      - media-processor-python/**
      - .github/workflows/media-pipeline.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r media-processor-python/requirements.txt
      - run: python -m py_compile media-processor-python/processor.py
      - run: python media-processor-python/processor.py --help
