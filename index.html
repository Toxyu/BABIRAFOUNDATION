<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Babira Ndeda Foundation - Vihiga - 12 Tabs</title><style>body{margin:0;background:#0f221a;color:#f0fdf4;font-family:system-ui}header{padding:12px 16px;background:rgba(15,34,26,.9);border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.logo{width:42px;height:42px;background:linear-gradient(135deg,#22c55e,#15803d);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 12px;position:sticky;top:56px;background:#0f221a;z-index:10}.tabs button{flex-shrink:0;padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#16382c;color:#a3d9b1;font-size:12px;cursor:pointer}.tabs button.active{background:#22c55e;color:#fff;border-color:#22c55e}.tabs button.donate{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.3)}.tabs button.donate.active{background:#fbbf24;color:#0f221a}.page{display:none;padding:16px;max-width:1100px;margin:0 auto;animation:fade .4s}.page.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.card{background:rgba(22,56,44,.7);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;margin-bottom:12px}.grid{grid-template-columns:1fr 1fr;gap:12px;display:grid}@media(max-width:700px){.grid{grid-template-columns:1fr}}.donate-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:900px){.donate-grid{grid-template-columns:1fr}}.slider{width:100%;accent-color:#fbbf24}.choice{padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);cursor:pointer;text-align:left;margin-bottom:6px}.choice.active{border-color:#22c55e;background:rgba(34,197,94,.15)}.bar{height:8px;background:#091712;border-radius:10px;overflow:hidden;margin-top:4px}.fill{height:100%;border-radius:10px;transition:width .6s}</style></head><body>
<header><div style="display:flex;gap:12px;align-items:center"><div class="logo">BNF</div><div><div style="font-weight:800">Babira Ndeda Foundation</div><div style="font-size:10px;color:#fbbf24">VIHIGA COUNTY KENYA</div></div></div><button style="padding:7px 12px;border-radius:10px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.12);color:#fbbf24;font-size:12px">CMS Portal</button></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<script>
const pages = [
{id:'about',name:'About Us',html:`<div class="card"><h2>About Babira Foundation</h2><p>Babira Foundation is a community-focused non-profit in Vihiga County, Kenya. Focus: Youth empowerment, Education, Community Health. Vision: A healthy, educated and economically empowered community where young people reach full potential. Mission: Empower youth and vulnerable communities through education, skills, economic opportunities, mentorship and health information.</p></div><div class="card"><h3>Latest Feed</h3><div id="feed">Loading...</div></div>`},
{id:'objectives',name:'Objectives and Values',html:`<div class="card"><h2>Objectives and Core Values</h2><ul><li>Empower youth with practical, entrepreneurial, digital and vocational skills</li><li>Promote access to education</li><li>Support vulnerable learners</li><li>Career guidance and mentorship</li><li>Entrepreneurship and income generation</li><li>Financial literacy</li><li>Preventive healthcare awareness</li><li>Community health education and referrals</li><li>Build partnerships</li><li>Community participation</li><li>Sustainable development</li><li>Inclusive opportunities</li></ul><p><b>Values:</b> Integrity, Accountability, Empowerment, Inclusion, Respect, Partnership, Sustainability</p></div>`},
{id:'youth',name:'Youth Empowerment',html:`<div class="card"><h2>Youth Empowerment Programme</h2><p>Equip young people with practical skills for employment and entrepreneurship. Activities: Entrepreneurship, digital skills, financial literacy, career guidance, mentorship, leadership, life-skills, vocational linkages, employment-readiness, business idea development, networking.</p></div>`},
{id:'education',name:'Education',html:`<div class="card"><h2>Education Programme</h2><p>Education support initiatives, learning materials, mentorship, career guidance, academic motivation, outreach, digital literacy, support for vulnerable learners, awareness campaigns, school partnerships.</p></div>`},
{id:'health',name:'Community Health',html:`<div class="card"><h2>Community Health and Development</h2><p>Health awareness campaigns, health education, preventive health, hygiene and sanitation, nutrition, youth health, outreach, screening partnerships, referrals, awareness on services. Target: youth, students, unemployed, entrepreneurs, vulnerable households, women and girls.</p></div>`},
{id:'geographical',name:'Geographical Focus',html:`<div class="card"><h2>Geographical Focus and Implementation Approach</h2><p>Focused on Vihiga County, Western Kenya. Approach: Identify needs, consult stakeholders, develop interventions, implement with participation, monitor, collect feedback, document lessons, improve based on evidence. Partnerships with government, schools, health facilities, CBOs, youth groups, private sector, NGOs.</p></div>`},
{id:'monitoring',name:'Monitoring',html:`<div class="card"><h2>Monitoring, Accountability and Funding</h2><p>Indicators: youth trained, learners supported, mentorship sessions, community members reached, entrepreneurship activities, health sessions, referrals, completion rate, feedback. Accountability: financial records, authorization, budgets, procurement, reports. Funding: Youth Empowerment, Education, Community Health, Institutional Capacity.</p></div>`},
{id:'partnership',name:'Partnership',html:`<div class="card"><h2>Partnership Opportunity</h2><p>Become trusted partner in Vihiga. Youth->Skills->Opportunities->Economic empowerment. Education->Knowledge->Confidence->Future. Health awareness->Prevention->Healthy communities->Productivity. Commitment: responsible use, financial records, updates, monitoring, open communication, dignity protection.</p></div>`},
{id:'gallery',name:'Gallery',html:`<div class="card"><h2>Gallery - Photos, Videos, Stories, Campaigns</h2><p>Each item has photo or video + Title + Short Description + Story behind it. Managed from CMS Portal. Permanent storage, editable deletable by admin. Like Facebook/Instagram.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px"><div class="card"><div style="height:160px;background:#16382c;border-radius:12px;display:flex;align-items:center;justify-content:center">Photo Sample</div><div style="font-weight:700;margin-top:8px">Youth Training in Luanda</div><div style="font-size:12px;color:#fbbf24">Empowering 30 youth with digital skills</div><div style="font-size:12px;color:#a3d9b1;margin-top:4px">Story behind it: Training conducted in Luanda ward with community participation...</div></div><div class="card"><div style="height:160px;background:#1c4a38;border-radius:12px;display:flex;align-items:center;justify-content:center">Video Sample</div><div style="font-weight:700;margin-top:8px">Health Outreach in Vihiga</div><div style="font-size:12px;color:#fbbf24">Community health awareness camp</div><div style="font-size:12px;color:#a3d9b1;margin-top:4px">Story behind it: Working with qualified health professionals...</div></div></div></div>`},
{id:'smart',name:'Smart Tools',html:`<div class="card"><h2>Smart Essentials Tools</h2><div class="grid"><div class="card"><h3>Bursary Checker</h3><input placeholder="Ward" style="width:100%;padding:8px;background:#091712;border:1px solid #ffffff1a;border-radius:8px;color:#fff;margin:6px 0"/><button style="width:100%;padding:8px;background:#22c55e;border:none;border-radius:8px;color:#fff">Check Eligibility</button></div><div class="card"><h3>Impact Calculator</h3><input placeholder="KES" style="width:100%;padding:8px;background:#091712;border:1px solid #ffffff1a;border-radius:8px;color:#fff;margin:6px 0"/><button style="width:100%;padding:8px;background:#fbbf24;border:none;border-radius:8px;color:#0f221a">Calculate</button></div></div></div>`},
{id:'contact',name:'Contact',html:`<div class="card"><h2>Contact Us</h2><p>BABIRA FOUNDATION - Empowering Youth. Advancing Education. Promoting Health. Vihiga County, Kenya. Email: info@babirandedafoundation.org</p><input placeholder="Email or WhatsApp" style="width:100%;padding:10px;background:#091712;border:1px solid #ffffff1a;border-radius:10px;color:#fff;margin:6px 0"/><button style="width:100%;padding:10px;background:#fbbf24;border:none;border-radius:10px;font-weight:700;color:#0f221a">Join the network</button></div>`},
{id:'donate',name:'Donate',html:`
<div style="background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(34,197,94,.12));border:1px solid rgba(251,191,36,.22);border-radius:20px;padding:16px;margin-bottom:12px">
<h2 style="font-size:22px">Support Vihiga Youth - Transparent Donation - 12th Tab</h2>
<p style="font-size:13px;opacity:.8">Your donation is permanently tracked and transparently utilized. Choose where your money goes - see genius calculation instantly. M-Pesa Paybill 522522 Account BABIRA</p>
</div>
<div class="donate-grid">
<div class="card">
<label style="font-size:10px;font-weight:700;color:#86efac">1. CHOOSE AMOUNT - KES</label>
<input type="range" id="amtSlider" min="100" max="100000" step="100" value="5000" class="slider" oninput="updateDonate()"/>
<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px"><span>100</span><span id="amtDisplay" style="font-weight:800;color:#fbbf24">KES 5,000</span><span>100k</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" id="presets"></div>
<input type="number" id="customAmt" placeholder="Or enter custom amount KES" style="width:100%;padding:10px;background:#091712;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;margin-top:8px" oninput="updateDonateCustom(this.value)"/>
<label style="font-size:10px;font-weight:700;color:#86efac;display:block;margin-top:14px">2. CHOOSE WHERE YOUR MONEY GOES - DONATOR CHOICE</label>
<div id="choices" style="margin-top:8px"></div>
<button onclick="donateNow()" style="width:100%;padding:14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:12px;font-weight:800;color:#0f221a;margin-top:12px">Donate Now - M-Pesa Paybill 522522 Account BABIRA</button>
</div>
<div class="card" style="position:sticky;top:120px">
<div style="font-size:11px;font-weight:700;color:#86efac">GENIUS UTILIZATION - HOW YOUR MONEY WILL BE USED</div>
<div id="bars" style="margin-top:10px"></div>
<div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px">
<div style="font-size:10px;font-weight:700;color:#86efac">IMPACT CALCULATION</div>
<div id="impacts" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"></div>
</div>
<div style="margin-top:12px;background:linear-gradient(135deg,#0a2e1a,#16382c);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:12px;font-size:11px">
<div style="font-weight:800;color:#fbbf24">M-Pesa Instructions</div>
<div style="margin-top:6px;line-height:1.6">Paybill: <b style="color:#fbbf24">522522</b><br/>Account: <b style="color:#fbbf24">BABIRA - <span id="accDisplay">GENERAL</span></b><br/>Amount: <b id="mpesaAmt" style="color:#fbbf24">KES 5,000</b><br/>Forward M-Pesa code for verification</div>
</div>
</div>
</div>
`}
];

let currentAmount=5000, currentChoice='general';
function renderTabs(){
  document.getElementById('tabs').innerHTML = pages.map(p=>`<button onclick="openPage('${p.id}')" id="btn-${p.id}" class="${p.id==='donate'?'donate':''} ${p.id==='donate'?'active':''}">${p.name}</button>`).join('');
  document.getElementById('main').innerHTML = pages.map(p=>`<div class="page ${p.id==='donate'?'active':''}" id="page-${p.id}">${p.html}</div>`).join('');
  initDonate();
}
function openPage(id){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+id).classList.add('active');
  document.getElementById('btn-'+id).scrollIntoView({behavior:'smooth',inline:'center'});
  if(id==='donate') updateDonate();
}
function initDonate(){
  const presets=[1000,5000,10000,20000,50000];
  document.getElementById('presets').innerHTML=presets.map(v=>`<button onclick="setAmt(${v})" class="presetBtn" style="padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:#fff;font-size:12px">${v.toLocaleString()}</button>`).join('');
  const choices=[{id:'general',t:'General Fund',d:'Balanced split'},{id:'youth',t:'Youth Empowerment',d:'Skills & mentorship'},{id:'education',t:'Education',d:'Bursaries & materials'},{id:'health',t:'Community Health',d:'Awareness & outreach'},{id:'bursary',t:'Direct Bursary',d:'100% school fees'},{id:'capacity',t:'Institutional Capacity',d:'Systems & volunteers'}];
  document.getElementById('choices').innerHTML=choices.map(c=>`<div class="choice ${currentChoice===c.id?'active':''}" onclick="setChoice('${c.id}')"><div style="font-weight:700;font-size:13px">${c.t}</div><div style="font-size:10px;opacity:.6">${c.d}</div></div>`).join('');
  updateDonate();
}
function setAmt(v){currentAmount=v; document.getElementById('amtSlider').value=v; document.getElementById('customAmt').value=v; updateDonate();}
function updateDonateCustom(v){const n=parseInt(v); if(n>=100){currentAmount=n; document.getElementById('amtSlider').value=n; updateDonate();}}
function setChoice(c){currentChoice=c; document.querySelectorAll('.choice').forEach(el=>el.classList.remove('active')); event.currentTarget.classList.add('active'); updateDonate();}
function getBreakdown(){
  if(currentChoice==='bursary') return [{l:'Direct School Fees',p:85,c:'#fbbf24'},{l:'Learning Materials',p:10,c:'#22c55e'},{l:'Monitoring',p:5,c:'#86efac'}];
  if(currentChoice==='youth') return [{l:'Digital Skills Training',p:40,c:'#fbbf24'},{l:'Entrepreneurship',p:25,c:'#22c55e'},{l:'Mentorship',p:20,c:'#86efac'},{l:'Monitoring',p:10,c:'#16a34a'},{l:'Admin',p:5,c:'#a3d9b1'}];
  if(currentChoice==='education') return [{l:'Direct Bursaries',p:50,c:'#fbbf24'},{l:'Learning Materials',p:20,c:'#22c55e'},{l:'Mentorship',p:15,c:'#86efac'},{l:'Digital Literacy',p:10,c:'#16a34a'},{l:'Monitoring',p:5,c:'#a3d9b1'}];
  if(currentChoice==='health') return [{l:'Health Awareness',p:35,c:'#fbbf24'},{l:'Hygiene & Sanitation',p:25,c:'#22c55e'},{l:'Nutrition & Youth Health',p:20,c:'#86efac'},{l:'Screening & Referrals',p:15,c:'#16a34a'},{l:'Monitoring',p:5,c:'#a3d9b1'}];
  return [{l:'Youth Empowerment',p:35,c:'#fbbf24'},{l:'Education',p:30,c:'#22c55e'},{l:'Health',p:20,c:'#86efac'},{l:'Monitoring',p:10,c:'#16a34a'},{l:'Capacity',p:5,c:'#a3d9b1'}];
}
function updateDonate(){
  document.getElementById('amtDisplay').innerText='KES '+currentAmount.toLocaleString();
  document.getElementById('mpesaAmt').innerText='KES '+currentAmount.toLocaleString();
  document.getElementById('accDisplay').innerText=currentChoice.toUpperCase();
  document.getElementById('amtSlider').value=currentAmount;
  const breakdown=getBreakdown();
  document.getElementById('bars').innerHTML=breakdown.map(b=>{const kes=Math.round(currentAmount*b.p/100); return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${b.l}</span><span style="color:${b.c};font-weight:800">${b.p}% - KES ${kes.toLocaleString()}</span></div><div class="bar"><div class="fill" style="width:${b.p}%;background:${b.c}"></div></div></div>`}).join('');
  document.getElementById('impacts').innerHTML=`<div style="background:rgba(0,0,0,.2);padding:10px;border-radius:10px;text-align:center"><div style="font-weight:800;color:#fbbf24">${Math.floor(currentAmount/500)}</div><div style="font-size:9px;opacity:.6">Youth Training Days</div></div><div style="background:rgba(0,0,0,.2);padding:10px;border-radius:10px;text-align:center"><div style="font-weight:800;color:#fbbf24">${Math.floor(currentAmount/3000)}</div><div style="font-size:9px;opacity:.6">Learners Supported</div></div><div style="background:rgba(0,0,0,.2);padding:10px;border-radius:10px;text-align:center"><div style="font-weight:800;color:#fbbf24">${Math.floor(currentAmount/400)}</div><div style="font-size:9px;opacity:.6">Health Reached</div></div><div style="background:rgba(0,0,0,.2);padding:10px;border-radius:10px;text-align:center"><div style="font-weight:800;color:#fbbf24">${Math.floor(currentAmount/5000)}</div><div style="font-size:9px;opacity:.6">Full Bursary Terms</div></div>`;
}
function donateNow(){alert(`Thank you - Donation intent KES ${currentAmount} for ${currentChoice.toUpperCase()}\nM-Pesa Paybill 522522 Account BABIRA - ${currentChoice.toUpperCase()}\nAmount: ${currentAmount}\nForward M-Pesa code for verification`);}
renderTabs();
</script>
</body></html>
